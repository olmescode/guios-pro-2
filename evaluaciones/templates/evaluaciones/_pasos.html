<div class="{% if paso > 1 %}hecho{% else %}actual{% endif %}"><i>{% if paso > 1 %}✓{% else %}1{% endif %}</i>Perfil</div>
<div class="{% if paso > 2 %}hecho{% elif paso == 2 %}actual{% endif %}"><i>{% if paso > 2 %}✓{% else %}2{% endif %}</i>Factores relevantes</div>
<div class="{% if paso > 3 %}hecho{% elif paso == 3 %}actual{% endif %}"><i>{% if paso > 3 %}✓{% else %}3{% endif %}</i>Subfactores</div>
<div class="{% if paso == 4 %}actual{% endif %}"><i>4</i>Resultado</div>
